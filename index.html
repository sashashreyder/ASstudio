<!doctype html>
<html lang="pt-BR" class="scroll-smooth">

<head>
  <script>
    (function () {
      var key = "as-studio-theme";
      var saved = localStorage.getItem(key);
      var theme =
        saved === "light" || saved === "dark"
          ? saved
          : window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon-dark.svg" media="(prefers-color-scheme: light)" />
  <link rel="icon" type="image/svg+xml" href="/favicon-light.svg" media="(prefers-color-scheme: dark)" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Design visual, sites, renders e conteúdo digital para marcas, produtos e espaços." />
  <title>AS Studio — Design visual, sites, renders e conteúdo digital para marcas, produtos e espaços.</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
